# Dark, sleek "sinister glass" theme for Krypton.
# Streamlit reads this automatically when you run the app from this folder.
[theme]
base = "dark"
primaryColor = "#ff2a3d"              # blood red accent
backgroundColor = "#060608"           # near-black
secondaryBackgroundColor = "#141015"  # panels
textColor = "#d6d6de"                 # cold grey text
font = "sans serif"

# ---- Safety settings for running Krypton on the public internet ----
[client]
toolbarMode = "viewer"      # visitors don't get the developer menu
showErrorDetails = "none"   # never show visitors internal error messages / code

[server]
runOnSave = false
maxUploadSize = 1           # Krypton has no uploads; keep the limit tiny
enableXsrfProtection = true # blocks forged requests from other websites

[browser]
gatherUsageStats = false
